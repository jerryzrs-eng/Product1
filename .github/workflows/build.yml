name: 构建

on:
  push:
    branches-ignore: ['ci-shots/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '要发布的版本号（如 1.1.0），留空则只构建不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 版本号
        shell: pwsh
        run: |
          # 推送 v1.2.3 这样的标签时用标签里的版本号，否则用默认版本
          $v = "1.0.0"
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if ("${{ inputs.release }}" -ne "") { $tag = "v" + "${{ inputs.release }}".TrimStart("v") }
          if ($tag -ne "") { $v = $tag.TrimStart("v") }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: 单元测试
        run: dotnet test tests/KeBiao.Core.Tests -c Release

      - name: 发布程序
        run: dotnet publish src/KeBiao.App -c Release -r win-x64 --self-contained true -o publish -p:Version=${{ env.APP_VERSION }}

      - name: 界面截图
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish\KeBiao.exe" -ArgumentList '--screenshot', "$PWD\shots" -PassThru -Wait
          if (Test-Path shots\log.txt) { Get-Content shots\log.txt }
          if (Test-Path screenshot-error.txt) { Get-Content screenshot-error.txt }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 生成模板
        run: dotnet run --project tools/KeBiao.TemplateGen -c Release -- shots/templates

      - name: 打包安装程序
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\KeBiao.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - name: 安装包实测（静默安装、检查、卸载）
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          "安装包大小：" + (Get-Item $exe).Length + " 字节"
          "SHA256：" + (Get-FileHash $exe -Algorithm SHA256).Hash
          $dir = "$env:RUNNER_TEMP\kebiao-install"
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$dir",'/TASKS=','/LOG=install.log' -PassThru -Wait
          Get-Content install.log -Tail 15
          if ($p.ExitCode -ne 0) { "安装失败，退出码 $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\KeBiao.exe")) { "安装后找不到 KeBiao.exe"; exit 1 }
          "安装成功，共 " + (Get-ChildItem $dir -Recurse -File).Count + " 个文件"
          Get-Process KeBiao -ErrorAction SilentlyContinue | Stop-Process -Force
          $un = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait }

      - uses: actions/upload-artifact@v4
        with:
          name: 课表-安装包
          path: dist/*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 截图
          path: shots

      - name: 发布到 Releases
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $notes = "docs/更新说明/$tag.md"
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          # 附件文件名只能用英文；“#”后面是 Release 页面上显示的中文名
          $asset = "$exe#课表安装包 $env:APP_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 版本已存在：换掉旧的安装包，更新说明
            $old = gh release view $tag --json assets --jq '.assets[] | select(.name | endswith(".exe")) | .name'
            # “--” 防止以“-”开头的文件名被当成参数
            foreach ($a in $old) { if ($a) { gh release delete-asset -y -- $tag $a } }
            gh release upload $tag $asset --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if (Test-Path $notes) { gh release edit $tag --notes-file $notes }
          } else {
            $args = @($tag, $asset, "--title", "课表 $tag", "--target", "${{ github.sha }}")
            if (Test-Path $notes) { $args += @("--notes-file", $notes) } else { $args += @("--generate-notes") }
            gh release create @args
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 从 Release 下载回来，确认和本地打出来的安装包完全一致
          New-Item -ItemType Directory -Force check | Out-Null
          gh release download $tag --pattern "*.exe" --dir check --clobber
          $a = (Get-FileHash $exe -Algorithm SHA256).Hash
          $b = (Get-FileHash (Get-ChildItem check\*.exe | Select-Object -First 1).FullName -Algorithm SHA256).Hash
          "本地：$a"
          "Release：$b"
          if ($a -ne $b) { "Release 上的安装包和本地不一致"; exit 1 }

      - name: 截图推送到 ci-shots 分支
        if: always() && github.ref_type == 'branch'
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          Set-Location shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "screenshots ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:refs/heads/ci-shots/${{ github.ref_name }}"
