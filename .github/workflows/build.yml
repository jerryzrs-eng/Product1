name: 构建

on:
  push:
    branches-ignore: ['ci-shots/**']
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      release:
        description: '要发布的版本号（如 1.1.0），留空则只构建不发布'
        required: false
        default: ''
      commit_sha:
        description: 正式发布时必填，经授权的完整 Commit SHA
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Windows 构建
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      app_version: ${{ steps.version.outputs.app_version }}
      release_commit: ${{ steps.version.outputs.release_commit }}
      screenshots: ${{ steps.screenshots.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: 固定发布版本与提交
        id: version
        shell: pwsh
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          $version = '1.0.0'
          $tag = ''
          $commit = ''
          if ($env:REQUESTED_RELEASE -or $env:REQUESTED_COMMIT) {
            if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -cne 'refs/heads/master') {
              throw '正式发布只能从 master 手动发起'
            }
            if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw '请重新提交发布请求并取得新的审批' }
            $tag = 'v' + ([string]$env:REQUESTED_RELEASE).Trim().TrimStart('v')
            if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw '请输入有效的发布版本' }
            $commit = ([string]$env:REQUESTED_COMMIT).Trim().ToLowerInvariant()
            if ($commit -notmatch '^[0-9a-f]{40}$') { throw '正式发布必须指定经授权的完整 Commit SHA' }
            $version = $tag.Substring(1)
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_COMMIT=$commit" >> $env:GITHUB_ENV
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_commit=$commit" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: 检查 Agent 提交署名
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/Test-AgentCommits.ps1 -Base $env:PR_BASE -Head $env:PR_HEAD

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 校验发布说明与关联提交
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/Test-ReleaseSource.ps1
          ./.github/scripts/Test-ReleaseApproval.ps1
          ./.github/scripts/Test-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT
          "等待仓库所有者审批。版本 $env:RELEASE_TAG，授权提交 $env:RELEASE_COMMIT" >> $env:GITHUB_STEP_SUMMARY

      - name: 单元测试
        run: dotnet test tests/KeBiao.Core.Tests -c Release

      - name: 发布程序
        run: dotnet publish src/KeBiao.App -c Release -r win-x64 --self-contained true -o publish -p:Version=${{ env.APP_VERSION }}

      - name: 界面截图
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish\KeBiao.exe" -ArgumentList '--screenshot', "$PWD\shots" -PassThru -Wait
          if (Test-Path shots\log.txt) { Get-Content shots\log.txt }
          if (Test-Path screenshot-error.txt) { Get-Content screenshot-error.txt }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 生成模板
        run: dotnet run --project tools/KeBiao.TemplateGen -c Release -- shots/templates

      - name: 打包安装程序
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\KeBiao.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - name: 安装包实测（静默安装、检查、卸载）
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          "安装包大小：" + (Get-Item $exe).Length + " 字节"
          "SHA256：" + (Get-FileHash $exe -Algorithm SHA256).Hash
          $dir = "$env:RUNNER_TEMP\kebiao-install"
          # 只等安装程序本身（-Wait 会连它启动的课表一起等，课表常驻不退出会卡住）
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$dir",'/TASKS=','/LOG=install.log' -PassThru
          if (-not $p.WaitForExit(180000)) { "安装超过 3 分钟没有结束（可能弹出了错误框）"; Stop-Process $p -Force; exit 1 }
          if (Test-Path install.log) { Get-Content install.log -Tail 15 }
          if ($p.ExitCode -ne 0) { "安装失败，退出码 $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\KeBiao.exe")) { "安装后找不到 KeBiao.exe"; exit 1 }
          "安装成功，共 " + (Get-ChildItem $dir -Recurse -File).Count + " 个文件"
          Get-Process KeBiao -ErrorAction SilentlyContinue | Stop-Process -Force
          $un = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          if ($un) { $u = Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru; [void]$u.WaitForExit(120000) }
          "卸载完成"

      - uses: actions/upload-artifact@v4
        with:
          name: 课表-安装包
          path: dist/*.exe

      - uses: actions/upload-artifact@v4
        id: screenshots
        if: always()
        with:
          name: 截图
          path: shots

  release:
    name: 正式发布 ${{ needs.build.outputs.release_tag }}
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && needs.build.outputs.release_tag != ''
    environment: kebiao-release
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: kebiao-release
      queue: max
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      APP_VERSION: ${{ needs.build.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: 课表-安装包
          path: dist
      - name: 发布到 Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          ./.github/scripts/Test-ReleaseSource.ps1
          ./.github/scripts/Test-ReleaseApproval.ps1 -RequireApproval
          ./.github/scripts/Test-ReleaseNotes.ps1 -Tag $tag -Commit $env:RELEASE_COMMIT
          $notes = "docs/更新说明/$tag.md"
          $exe = (Get-Item -LiteralPath "dist/KeBiao-Setup-$env:APP_VERSION.exe").FullName
          $name = Split-Path -Leaf $exe
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/$env:GITHUB_RUN_ATTEMPT"
          $body = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Copy-Item -LiteralPath $notes -Destination $body
          @(
            ''
            '## 构建记录'
            ''
            "- 构建提交：$env:RELEASE_COMMIT"
            "- GitHub Actions：$runUrl"
            "- 安装包 SHA-256：$hash"
          ) | Add-Content -LiteralPath $body -Encoding utf8

          # 草稿通过附件校验后再公开。
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "版本 $tag 已有发布记录，请核查现有 Release 或草稿" }
          gh release create $tag "$exe#课表安装包 $env:APP_VERSION" --draft --title "课表 $tag" --target $env:RELEASE_COMMIT --notes-file $body
          if ($LASTEXITCODE -ne 0) { throw '创建 Release 草稿失败，请检查该版本是否已经存在' }
          $checkDir = Join-Path $env:RUNNER_TEMP 'release-check'
          gh release download $tag --pattern $name --dir $checkDir
          if ($LASTEXITCODE -ne 0) { throw '下载草稿安装包失败' }
          $downloadedHash = (Get-FileHash -LiteralPath (Join-Path $checkDir $name) -Algorithm SHA256).Hash
          if ($hash -ne $downloadedHash) { throw 'Release 草稿安装包与构建产物的 SHA-256 不一致' }

          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw '公开 Release 失败' }
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:RELEASE_COMMIT) {
            throw 'Release 标签指向的提交与构建提交不一致'
          }
          $release = gh release view $tag --json isDraft,tagName,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -ne $false -or $release.tagName -ne $tag -or $name -notin $release.assets.name) {
            throw '公开 Release 的版本或安装包验证失败'
          }
          $publicDir = Join-Path $env:RUNNER_TEMP 'release-public-check'
          gh release download $tag --pattern $name --dir $publicDir
          if ($LASTEXITCODE -ne 0) { throw '下载正式安装包失败' }
          $publicHash = (Get-FileHash -LiteralPath (Join-Path $publicDir $name) -Algorithm SHA256).Hash
          if ($hash -ne $publicHash) { throw '正式安装包与构建产物的 SHA-256 不一致' }
          "Release：$($release.url)"
          "SHA-256：$hash"


  screenshots:
    name: 同步截图分支
    needs: build
    if: always() && needs.build.outputs.screenshots != '' && github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 截图
          path: shots
      - name: 截图推送到 ci-shots 分支
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          Set-Location shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "screenshots ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:refs/heads/ci-shots/$env:GITHUB_REF_NAME"
